<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>3Chat — Profile</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="profile.css"
  />

</head>


<body>

  <!-- ==========================================
       BACKGROUND
  =========================================== -->

  <div
    class="background-grid"
    aria-hidden="true"
  ></div>

  <div
    class="background-glow glow-pink"
    aria-hidden="true"
  ></div>

  <div
    class="background-glow glow-cyan"
    aria-hidden="true"
  ></div>


  <!-- ==========================================
       LOADER
  =========================================== -->

  <div
    id="loader"
    class="loader"
    aria-hidden="true"
  >

    <div class="loader-box">

      <div
        class="spinner"
        aria-hidden="true"
      ></div>

      <span>
        Loading profile...
      </span>

    </div>

  </div>


  <!-- ==========================================
       HEADER
  =========================================== -->

  <header class="topbar">

    <button
      id="backBtn"
      class="back-btn"
      type="button"
      aria-label="Go back to home"
    >

      <span aria-hidden="true">
        ←
      </span>

      <span>
        Home
      </span>

    </button>


    <div class="topbar-title">

      <span
        class="topbar-dot"
        aria-hidden="true"
      ></span>

      <span>
        3Chat
      </span>

    </div>


    <div
      id="usernameDisplay"
      class="logged-user"
      aria-label="Logged in user"
    ></div>

  </header>


  <!-- ==========================================
       PROFILE
  =========================================== -->

  <main class="profile-page">

    <section
      id="profile"
      class="profile-card"
      aria-live="polite"
    ></section>

  </main>


  <!-- ==========================================
       JAVASCRIPT
  =========================================== -->

  <script
    type="module"
    src="profile.js"
  ></script>

</body>

</html>
